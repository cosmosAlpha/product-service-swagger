services:
  postgres:
    image: 'postgres:latest'
    container_name: 'product-db'
    environment:
      POSTGRES_DB: 'product_db'
      POSTGRES_USER: 'ap-user'
      POSTGRES_PASSWORD: 'strong-secret'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
